[package]
name = "hm-rag-rust"
version = "0.1.0"
edition = "2024"

[lints.rust]
warnings = "allow"

[dependencies]
# async runtime
tokio = { version = "1", features = ["full"] }
anyhow = "1"

# Rust Qdrant client (talks gRPC on port 6334, NOT the 6333 HTTP port
# the Python `qdrant-client` used).

# Local embedding model - runs BAAI/bge-small-en-v1.5 (384-dim) via ONNX,
# same model the Python side used through `sentence-transformers`.
fastembed = "4"

# Rig - the LLM framework, mirrors the rag_ollama example.
#rig-core = "0.38"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
rig = "0.42.0"
qdrant-client = "1.19.0"
